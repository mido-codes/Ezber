name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Every job only reads the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each platform job becomes active only once its directory lands, so the
      # workflow stays green on a repository that does not have every platform.
      - name: Detect content-pipeline/
        id: detect
        run: |
          if [ -d content-pipeline ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: content-pipeline
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi

      - name: Run tests
        if: steps.detect.outputs.present == 'true'
        working-directory: content-pipeline
        run: |
          if [ -f Makefile ] && make -n test >/dev/null 2>&1; then
            make test
          else
            python -m pip install pytest
            python -m pytest
          fi

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect android/
        id: detect
        run: |
          if [ -d android ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.detect.outputs.present == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        if: steps.detect.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build debug APK
        if: steps.detect.outputs.present == 'true'
        working-directory: android
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

  ios:
    name: iOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect ios/
        id: detect
        run: |
          if [ -d ios ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # The project needs Xcode 16 (objectVersion 77); use the newest stable
      # Xcode the runner image ships instead of relying on the image default.
      - name: Select latest stable Xcode
        if: steps.detect.outputs.present == 'true'
        run: |
          latest=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: |
          xcodebuild -project ios/Ezber.xcodeproj -scheme Ezber \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
